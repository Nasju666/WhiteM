services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradinghub
      POSTGRES_USER: tradinghub_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nasju0465}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradinghub_user -d tradinghub"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Django / Gunicorn ───────────────────────────────────────
  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-dev-key}
      - DEBUG=${DEBUG:-False}
      - DB_NAME=tradinghub
      - DB_USER=tradinghub_user
      - DB_PASSWORD=${DB_PASSWORD:-nasju0465}
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      - WEB3_PROVIDER_URL=${WEB3_PROVIDER_URL:-http://hardhat:8545}
      - ESCROW_CONTRACT_ADDRESS=${ESCROW_CONTRACT_ADDRESS:-}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    expose:
      - "8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn tradinghub.wsgi:application
             --bind 0.0.0.0:8000
             --workers ${GUNICORN_WORKERS:-3}
             --timeout 120
             --access-logfile -"

  # ── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro

  # ── Hardhat Node (dev only) ─────────────────────────────────
  hardhat:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./blockchain:/app
    command: sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"
    profiles:
      - dev

volumes:
  pgdata:
  static_files:
  media_files:
