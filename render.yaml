# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Values marked `sync: false` are asked for once when you create the Blueprint.
services:
  - type: web
    name: whitemarket-api          # becomes https://whitemarket-api.onrender.com if the name is free
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true        # copy it into the GitHub secret CRON_SECRET
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: CORS_ORIGINS
        sync: false                # e.g. https://whitemarket.pages.dev
      - key: DATABASE_URL
        sync: false                # Neon connection string

      # Blockchain (Base Sepolia testnet by default)
      - key: CHAIN_ID
        value: "84532"
      - key: WEB3_PROVIDER_URL
        value: https://sepolia.base.org
      - key: USDC_TOKEN_ADDRESS
        value: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false
      - key: ARBITER_PRIVATE_KEY
        sync: false

      # Pricing
      - key: PRICE_FEED
        value: coingecko
      - key: PHP_PER_USDC
        value: "63.76"

      # Uploads (Neon Object Storage or any S3-compatible bucket)
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
