# Hourly escrow maintenance: pays sellers after the auto-release deadline and
# syncs settled orders. Needed because Render's free plan has no cron jobs.
# Repo -> Settings -> Secrets and variables -> Actions:
#   API_URL      e.g. https://whitemarket-api.onrender.com
#   CRON_SECRET  same value as CRON_SECRET on Render
name: Release expired escrows

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch:        # "Run workflow" button for manual runs

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call backend
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL / CRON_SECRET secrets not set; skipping."; exit 0
          fi
          # Free instances sleep; the first request can take ~1 minute to wake them.
          curl --fail-with-body --silent --show-error --retry 4 --retry-delay 20 \
            --retry-all-errors --max-time 180 \
            -X POST "$API_URL/api/internal/release-expired/" \
            -H "Authorization: Bearer $CRON_SECRET"
